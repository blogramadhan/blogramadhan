baseURL = "https://ramadhan.me/"
languageCode = "id-ID"
defaultContentLanguage = "id"
title = "Kurnia Ramadhan — Jurnal & Karya"
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Ringkasan otomatis
summaryLength = 40

# Pagination (Hugo v0.128+)
[pagination]
  pagerSize = 6

[params]
  # Identitas situs
  author = "Kurnia Ramadhan"
  # Ditampilkan sebagai pil kecil di atas judul beranda.
  role = "Catatan Ringan"
  description = "Jurnal pribadi, catatan teknis, dan portofolio karya"
  tagline = "Menulis pelan, membangun perlahan."
  # Teks intro di beranda
  intro = "Selamat datang. Ini ruang tempat saya menautkan pikiran, catatan teknis, dan karya yang sedang saya rawat."
  # Kontak / sosial (kosongkan bila tak dipakai)
  email = "kramadhan@gmail.com"
  github = "https://github.com/blogramadhan"
  linkedin = ""
  twitter = ""
  # Fitur
  showReadingTime = true
  dateFormat = "2 January 2006"
  # Copyright
  copyrightYear = 2026

[menu]
  [[menu.main]]
    name = "Beranda"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "Blog"
    pageRef = "/posts"
    weight = 20
  [[menu.main]]
    name = "Portofolio"
    pageRef = "/projects"
    weight = 30
  [[menu.main]]
    name = "Tentang"
    pageRef = "/about"
    weight = 40

[markup]
  [markup.highlight]
    # noClasses=false → Chroma memancarkan class, diwarnai assets/css/syntax.css
    # (dibangkitkan dari gaya github & github-dark). Ganti gaya = bangkitkan ulang.
    style = "github"
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
