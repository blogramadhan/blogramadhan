<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-label="Urutan pemakaian memori waktu RAM menipis: RAM dipakai lebih dulu, lalu zram yang memadatkan data di dalam RAM dengan prioritas 100, lalu swap file di disk dengan prioritas minus dua, dan terakhir kernel mematikan proses lewat OOM killer">
  <defs>
    <linearGradient id="uorange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a072"/><stop offset="1" stop-color="#e95420"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="880" fill="#0e1014"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="96" font-size="22" font-weight="700" letter-spacing="5" fill="#f0a072">URUTAN PAKAI WAKTU MEMORI MENIPIS</text>
    <text x="100" y="152" font-size="36" font-weight="800" fill="#f4f2ec">Angka prioritas menentukan siapa duluan</text>
    <text x="100" y="198" font-size="23" fill="#8a94a5">Makin besar angkanya, makin dulu dipakai. Panjang batang menggambarkan kecepatan relatif.</text>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <!-- 1 RAM -->
    <circle cx="132" cy="288" r="26" fill="#1b2b33" stroke="#4a7f96" stroke-width="2.5"/>
    <text x="132" y="297" font-size="24" font-weight="800" fill="#7fc0da" text-anchor="middle">1</text>
    <text x="186" y="278" font-size="26" font-weight="700" fill="#f4f2ec">RAM biasa</text>
    <text x="186" y="310" font-size="20" fill="#8a94a5">Paling cepat. Dipakai selama masih ada.</text>
    <rect x="800" y="266" width="640" height="42" rx="8" fill="#1b2b33" stroke="#4a7f96" stroke-width="2"/>
    <text x="820" y="294" font-size="21" fill="#7fc0da">tanpa perantara</text>

    <!-- 2 ZRAM -->
    <circle cx="132" cy="424" r="26" fill="#33180f" stroke="#e95420" stroke-width="2.5"/>
    <text x="132" y="433" font-size="24" font-weight="800" fill="#f7a072" text-anchor="middle">2</text>
    <text x="186" y="414" font-size="26" font-weight="700" fill="#f4f2ec">zram <tspan font-size="21" font-weight="500" fill="#8a94a5">— prioritas 100</tspan></text>
    <text x="186" y="446" font-size="20" fill="#8a94a5">Masih di RAM, tapi dipadatkan. Bayarnya pakai CPU.</text>
    <rect x="800" y="402" width="452" height="42" rx="8" fill="#33180f" stroke="#e95420" stroke-width="2"/>
    <text x="820" y="430" font-size="21" fill="#f7a072">kompres lalu simpan</text>

    <!-- 3 SWAP -->
    <circle cx="132" cy="560" r="26" fill="#161b1f" stroke="#4a545c" stroke-width="2.5"/>
    <text x="132" y="569" font-size="24" font-weight="800" fill="#a3aebd" text-anchor="middle">3</text>
    <text x="186" y="550" font-size="26" font-weight="700" fill="#f4f2ec">swap file di disk <tspan font-size="21" font-weight="500" fill="#8a94a5">— prioritas -2</tspan></text>
    <text x="186" y="582" font-size="20" fill="#8a94a5">Keluar dari RAM. Jauh lebih lambat, tapi lega.</text>
    <rect x="800" y="538" width="188" height="42" rx="8" fill="#161b1f" stroke="#4a545c" stroke-width="2"/>
    <text x="820" y="566" font-size="21" fill="#a3aebd">tulis ke disk</text>

    <!-- 4 OOM -->
    <circle cx="132" cy="696" r="26" fill="#2e1a1a" stroke="#a45555" stroke-width="2.5"/>
    <text x="132" y="705" font-size="24" font-weight="800" fill="#e0a0a0" text-anchor="middle">4</text>
    <text x="186" y="686" font-size="26" font-weight="700" fill="#e0a0a0">OOM killer</text>
    <text x="186" y="718" font-size="20" fill="#8a94a5">Semua penuh. Kernel mematikan salah satu proses.</text>
    <rect x="800" y="674" width="70" height="42" rx="8" fill="#2e1a1a" stroke="#a45555" stroke-width="2"/>
    <text x="886" y="702" font-size="21" fill="#e0a0a0">berhenti</text>
  </g>

  <text x="100" y="816" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" fill="#8a94a5">Tanpa swap sama sekali, langkah 3 hilang — dari RAM penuh langsung ke langkah 4.</text>
</svg>
