<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Diagram: satu resource di Grit menghasilkan model, API, tipe TypeScript, hooks, dan halaman admin, lalu dipakai web, desktop, dan mobile">
  <rect width="1200" height="520" rx="20" fill="#101c22"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="22" font-weight="700" fill="#e8f3f2">Satu perintah, satu repo</text>

    <!-- kolom 1 -->
    <rect x="50" y="190" width="230" height="130" rx="16" fill="#0f2a30" stroke="#2aa8a0" stroke-width="3"/>
    <text x="165" y="238" font-size="20" font-weight="700" fill="#6fe0cf">grit generate</text>
    <text x="165" y="268" font-size="20" font-weight="700" fill="#6fe0cf">resource</text>
    <text x="165" y="298" font-size="15" fill="#86a1a2">deskripsi resource</text>

    <path d="M286 255 H350" stroke="#3b6e72" stroke-width="3" fill="none"/>
    <path d="M344 247 L356 255 L344 263" stroke="#3b6e72" stroke-width="3" fill="none"/>

    <!-- kolom 2 -->
    <g font-size="17" fill="#e8f3f2">
      <rect x="360" y="90" width="270" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="495" y="121">Model &amp; migrasi (Go)</text>
      <rect x="360" y="152" width="270" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="495" y="183">API</text>
      <rect x="360" y="214" width="270" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="495" y="245">Tipe TypeScript</text>
      <rect x="360" y="276" width="270" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="495" y="307">React hooks</text>
      <rect x="360" y="338" width="270" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="495" y="369">Halaman admin</text>
    </g>

    <path d="M636 255 H700" stroke="#3b6e72" stroke-width="3" fill="none"/>
    <path d="M694 247 L706 255 L694 263" stroke="#3b6e72" stroke-width="3" fill="none"/>

    <!-- kolom 3 -->
    <circle cx="800" cy="255" r="62" fill="#0f2a30" stroke="#2aa8a0" stroke-width="3"/>
    <text x="800" y="264" font-size="26" font-weight="800" fill="#6fe0cf">API Go</text>

    <g stroke="#3b6e72" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M862 255 H940"/>
      <path d="M850 205 L940 130"/>
      <path d="M850 305 L940 380" stroke-dasharray="4 10"/>
    </g>

    <g font-size="20" font-weight="700">
      <rect x="945" y="215" width="205" height="80" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="1047" y="262" fill="#e8f3f2">Web</text>
      <rect x="945" y="90" width="205" height="80" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#2f5559" stroke-width="2"/>
      <text x="1047" y="137" fill="#e8f3f2">Desktop</text>
      <rect x="945" y="340" width="205" height="80" rx="14" fill="none" stroke="#3b6e72" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="1047" y="387" fill="#7f9a9c">Mobile</text>
    </g>
    <text x="1047" y="190" font-size="14" fill="#86a1a2">Windows &amp; macOS</text>
    <text x="1047" y="440" font-size="14" fill="#7f9a9c">rencana berikutnya</text>

    <text x="600" y="490" font-size="15" fill="#86a1a2">Berdasarkan dokumentasi Grit; versi mobile belum saya coba.</text>
  </g>
</svg>
