<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Grafik batang membandingkan ukuran dua keputusan. Memilih frekuensi harian daripada bulanan bernilai 0,07 persen. Mengunci nominal rupiah alih-alih jumlah lot bernilai 0,37 persen pada volatilitas 15 persen, 1,46 persen pada 30 persen, dan 4,03 persen pada 50 persen. Keunggulan mengunci rupiah berlaku pasti secara aljabar; yang disimulasikan hanya besarnya.">
  <rect width="1600" height="1000" fill="#0e1219"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="60" y="100" font-size="50" font-weight="800" fill="#f2f4f8">Dua Keputusan, Dua Ukuran</text>
    <text x="60" y="150" font-size="26" fill="#8a94a5">Berapa persen dana yang benar-benar dipengaruhi tiap keputusan. Emas lazimnya bergerak di volatilitas 15%.</text>

    <g font-size="23">
      <rect x="380" y="196" width="26" height="26" rx="4" fill="#3987e5"/>
      <text x="418" y="217" fill="#c9d1dc">Seberapa sering membeli</text>
      <rect x="900" y="196" width="26" height="26" rx="4" fill="#c98500"/>
      <text x="938" y="217" fill="#c9d1dc">Apa yang dikunci saat membeli</text>
    </g>

    <g stroke="#1e2634" stroke-width="2">
      <line x1="624"  y1="280" x2="624"  y2="740"/>
      <line x1="869"  y1="280" x2="869"  y2="740"/>
      <line x1="1113" y1="280" x2="1113" y2="740"/>
      <line x1="1358" y1="280" x2="1358" y2="740"/>
    </g>
    <line x1="380" y1="280" x2="380" y2="740" stroke="#3a4557" stroke-width="2"/>

    <rect x="380" y="310" width="17"  height="72" rx="4" fill="#3987e5"/>
    <rect x="380" y="422" width="90"  height="72" rx="4" fill="#c98500"/>
    <rect x="380" y="534" width="357" height="72" rx="4" fill="#c98500"/>
    <rect x="380" y="646" width="985" height="72" rx="4" fill="#c98500"/>

    <g font-size="29" font-weight="700" fill="#f2f4f8">
      <text x="415"  y="357">0,07%</text>
      <text x="488"  y="469">0,37%</text>
      <text x="755"  y="581">1,46%</text>
      <text x="1383" y="693">4,03%</text>
    </g>

    <g text-anchor="end">
      <g font-size="25" font-weight="700" fill="#c9d1dc">
        <text x="352" y="347">Harian, bukan bulanan</text>
        <text x="352" y="459">Rupiah, bukan lot</text>
        <text x="352" y="571">Rupiah, bukan lot</text>
        <text x="352" y="683">Rupiah, bukan lot</text>
      </g>
      <g font-size="21" fill="#6f7b8c">
        <text x="352" y="377">volatilitas 15%</text>
        <text x="352" y="489">volatilitas 15% — emas hari ini</text>
        <text x="352" y="601">volatilitas 30%</text>
        <text x="352" y="713">volatilitas 50%</text>
      </g>
    </g>

    <g font-size="22" fill="#6f7b8c" text-anchor="middle">
      <text x="380"  y="778">0%</text>
      <text x="624"  y="778">1%</text>
      <text x="869"  y="778">2%</text>
      <text x="1113" y="778">3%</text>
      <text x="1358" y="778">4%</text>
    </g>

    <rect x="60" y="828" width="1480" height="112" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#243040" stroke-width="2"/>
    <text x="88" y="874" font-size="24" fill="#c9d1dc">Batang biru menang tipis dan tidak pasti — ia tenggelam di gerak harga yang rentangnya ±28%.</text>
    <text x="88" y="912" font-size="24" fill="#c9d1dc">Batang emas <tspan font-weight="700" fill="#f7d26b">selalu</tspan> menang: itu aljabar, bukan statistik. Yang disimulasikan besarnya, bukan arahnya.</text>
  </g>
</svg>
