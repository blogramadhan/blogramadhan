  <text x="1188" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" fill="#5d7f9e" text-anchor="middle">tanpa basis data</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="308" font-size="23" font-weight="700" letter-spacing="6" fill="#6ab8f4">TUTORIAL · HUGO</text>
    <text x="96" y="418" font-size="82" font-weight="800" letter-spacing="-3" fill="#f1f5f9">MEMAHAMI HUGO</text>
    <text x="96" y="510" font-size="82" font-weight="800" letter-spacing="-3" fill="url(#hblue)">DALAM LIMA MENIT</text>
    <rect x="100" y="548" width="120" height="5" rx="2.5" fill="#2a6fbd"/>
    <text x="100" y="620" font-size="31" fill="#8496a8">Peta ringkas cara berkas Markdown</text>
    <text x="100" y="664" font-size="31" fill="#8496a8">berubah jadi situs yang cepat.</text>

    <g>
