    <text x="1072" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#8ad6fb">.md</text>
    <g stroke="#4f7fa8" stroke-width="3" stroke-linecap="round">
