<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Tutorial Memahami Hugo dalam Lima Menit: berkas Markdown diubah menjadi situs statis. Tiga folder inti, dua perintah, tanpa basis data.">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/><stop offset="0.5" stop-color="#0a1320"/><stop offset="1" stop-color="#080d14"/>
    </linearGradient>
    <linearGradient id="hblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad6fb"/><stop offset="1" stop-color="#2a6fbd"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.22"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#hbg)"/>
  <ellipse cx="1250" cy="410" rx="390" ry="330" fill="url(#hglow)"/>

  <!-- tumpukan berkas markdown -->
  <g>
