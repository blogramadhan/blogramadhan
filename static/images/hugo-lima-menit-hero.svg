    <polyline points="1230,388 1246,402 1230,416"/>
  </g>

  <!-- jendela browser -->
  <g>
    <rect x="1280" y="292" width="256" height="220" rx="12" fill="#0f2338" stroke="#3987e5" stroke-width="2.5"/>
    <rect x="1280" y="292" width="256" height="34" rx="12" fill="#17304a"/>
    <rect x="1280" y="314" width="256" height="12" fill="#17304a"/>
    <g fill="#4f7fa8"><circle cx="1302" cy="309" r="5"/><circle cx="1320" cy="309" r="5"/><circle cx="1338" cy="309" r="5"/></g>
    <rect x="1304" y="352" width="140" height="16" rx="5" fill="#8ad6fb"/>
    <g stroke="#3d6a91" stroke-width="3" stroke-linecap="round">
      <line x1="1304" y1="392" x2="1510" y2="392"/>
      <line x1="1304" y1="412" x2="1480" y2="412"/>
      <line x1="1304" y1="432" x2="1502" y2="432"/>
      <line x1="1304" y1="452" x2="1440" y2="452"/>
