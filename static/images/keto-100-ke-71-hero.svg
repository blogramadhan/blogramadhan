<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Dari 100 ke 71,95: berat badan turun 28,05 kilogram dalam lima bulan, Juni sampai Oktober 2026, dengan pola makan keto yang condong ke carnivore">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="0.55" stop-color="#0e1219"/><stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="kgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c35a"/><stop offset="1" stop-color="#c98500"/>
    </linearGradient>
    <radialGradient id="kglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c98500" stop-opacity="0.16"/><stop offset="1" stop-color="#c98500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#kbg)"/>
  <ellipse cx="1250" cy="430" rx="380" ry="320" fill="url(#kglow)"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="1020" y="250" font-size="17" font-weight="700" letter-spacing="3" fill="#8a94a5">JUNI</text>
    <text x="1430" y="250" font-size="17" font-weight="700" letter-spacing="3" fill="#8a94a5" text-anchor="end">OKTOBER</text>
    <rect x="1020" y="276" width="70" height="300" rx="10" fill="#3987e5" fill-opacity="0.25" stroke="#3987e5" stroke-width="2.5"/>
    <rect x="1360" y="360" width="70" height="216" rx="10" fill="#c98500" fill-opacity="0.25" stroke="#c98500" stroke-width="2.5"/>
    <path d="M1100 300 C 1200 310, 1260 350, 1350 380" fill="none" stroke="#c9d1dc" stroke-width="2.5" stroke-dasharray="8 8"/>
    <path d="M1338 370 L1352 381 L1336 389" fill="none" stroke="#c9d1dc" stroke-width="2.5"/>
    <text x="1055" y="620" font-size="34" font-weight="800" fill="#f2f4f8" text-anchor="middle">100</text>
    <text x="1395" y="620" font-size="34" font-weight="800" fill="#f0c35a" text-anchor="middle">71,95</text>
    <text x="1055" y="650" font-size="16" fill="#8a94a5" text-anchor="middle">kg</text>
    <text x="1395" y="650" font-size="16" fill="#8a94a5" text-anchor="middle">kg</text>
    <line x1="1000" y1="576" x2="1450" y2="576" stroke="#2a3240" stroke-width="2"/>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="308" font-size="23" font-weight="700" letter-spacing="6" fill="#c98500">JURNAL &#183; POLA MAKAN</text>
    <text x="96" y="424" font-size="80" font-weight="800" letter-spacing="-2.5" fill="#f2f4f8">DARI 100</text>
    <text x="96" y="512" font-size="80" font-weight="800" letter-spacing="-2.5" fill="url(#kgold)">KE 71,95</text>
    <rect x="100" y="548" width="120" height="5" rx="2.5" fill="#c98500"/>
    <text x="100" y="620" font-size="31" fill="#c9d1dc">Keto yang makin condong ke carnivore.</text>
    <text x="100" y="664" font-size="31" fill="#8a94a5">Karbo dan gula ditekan sejauh mungkin.</text>

    <g>
      <rect x="100" y="744" width="232" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#2a3240" stroke-width="2"/>
      <text x="126" y="796" font-size="38" font-weight="800" fill="#f2f4f8">&#8722;28,05</text>
      <text x="126" y="828" font-size="17" fill="#8a94a5">kilogram</text>

      <rect x="354" y="744" width="222" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#2a3240" stroke-width="2"/>
      <text x="380" y="796" font-size="38" font-weight="800" fill="#f2f4f8">5 bulan</text>
      <text x="380" y="828" font-size="17" fill="#8a94a5">Juni&#8211;Oktober 2026</text>

      <rect x="598" y="744" width="242" height="118" rx="16" fill="#c98500" fill-opacity="0.10" stroke="#c98500" stroke-width="2.5"/>
      <text x="624" y="796" font-size="38" font-weight="800" fill="#f0c35a">&#177;1,3 kg</text>
      <text x="624" y="828" font-size="17" fill="#8a94a5">rata-rata per minggu</text>
    </g>
