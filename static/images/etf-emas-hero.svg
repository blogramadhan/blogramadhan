<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="ETF Emas Indonesia — emas fisik yang diperdagangkan seperti saham">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1219"/>
      <stop offset="0.55" stop-color="#141a25"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="0.45" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#b9781a"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="1" stop-color="#e0a021"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M100 0V1000M200 0V1000M300 0V1000M400 0V1000M500 0V1000M600 0V1000M700 0V1000M800 0V1000M900 0V1000M1000 0V1000M1100 0V1000M1200 0V1000M1300 0V1000M1400 0V1000M1500 0V1000"/>
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600"/>
  </g>
  <ellipse cx="1220" cy="430" rx="560" ry="440" fill="url(#glow)"/>

  <!-- Grafik naik -->
  <path d="M900 700 L960 662 L1020 690 L1080 608 L1140 640 L1200 558 L1260 520 L1320 556 L1380 468 L1440 418 L1500 344 L1500 782 L900 782 Z" fill="url(#chartFill)"/>
  <path d="M900 700 L960 662 L1020 690 L1080 608 L1140 640 L1200 558 L1260 520 L1320 556 L1380 468 L1440 418 L1500 344"
        fill="none" stroke="url(#goldText)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1500" cy="344" r="11" fill="#ffe6a3"/>
  <circle cx="1500" cy="344" r="22" fill="none" stroke="#f0b429" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Batangan emas -->
  <g stroke="#8a5c12" stroke-opacity="0.55" stroke-width="2">
    <polygon points="940,782 1150,782 1128,720 962,720" fill="url(#gold)"/>
    <polygon points="962,720 1128,720 1098,692 992,692" fill="#ffdd93"/>
    <polygon points="1170,782 1380,782 1358,720 1192,720" fill="url(#gold)"/>
    <polygon points="1192,720 1358,720 1328,692 1222,692" fill="#ffdd93"/>
    <polygon points="1055,692 1265,692 1243,630 1077,630" fill="url(#gold)"/>
    <polygon points="1077,630 1243,630 1213,602 1107,602" fill="#ffe9ae"/>
  </g>
  <text x="1160" y="670" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="20" font-weight="700" letter-spacing="3" fill="#8a5c12" fill-opacity="0.75">999.9</text>

  <!-- Teks utama -->
  <text x="110" y="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="25"
        font-weight="700" letter-spacing="7" fill="#f0b429">PASAR MODAL INDONESIA</text>
  <text x="106" y="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="126"
        font-weight="800" letter-spacing="-3" fill="#f2f4f8">ETF EMAS</text>
  <text x="106" y="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="126"
        font-weight="800" letter-spacing="-3" fill="url(#goldText)">INDONESIA</text>
  <rect x="110" y="648" width="120" height="5" rx="2.5" fill="#f0b429"/>
  <text x="110" y="722" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="34"
        fill="#9aa5b6">Emas fisik yang diperdagangkan seperti saham.</text>
  <text x="110" y="772" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="28"
        fill="#6f7b8d">Bursa Efek Indonesia · 10 Agustus 2026</text>

  <!-- Pil kode efek -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" font-weight="700" letter-spacing="2.5">
    <g>
      <rect x="110" y="866" width="170" height="60" rx="30" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.45"/>
      <text x="195" y="905" text-anchor="middle" fill="#ffd97a">XGLD</text>
    </g>
    <g>
      <rect x="300" y="866" width="170" height="60" rx="30" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.45"/>
      <text x="385" y="905" text-anchor="middle" fill="#ffd97a">XDES</text>
    </g>
    <g>
      <rect x="490" y="866" width="170" height="60" rx="30" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.45"/>
      <text x="575" y="905" text-anchor="middle" fill="#ffd97a">XMES</text>
    </g>
    <g>
      <rect x="680" y="866" width="170" height="60" rx="30" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.45"/>
      <text x="765" y="905" text-anchor="middle" fill="#ffd97a">XSGO</text>
    </g>
    <g>
      <rect x="870" y="866" width="170" height="60" rx="30" fill="#f0b429" fill-opacity="0.10" stroke="#f0b429" stroke-opacity="0.45"/>
      <text x="955" y="905" text-anchor="middle" fill="#ffd97a">XTRA</text>
    </g>
  </g>
  <text x="1070" y="905" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26"
        fill="#6f7b8d">seluruhnya berprinsip syariah</text>
</svg>
