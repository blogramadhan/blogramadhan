<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ujian Negara Amatir Radio tingkat Siaga, Pontianak, September 2026, nilai akhir 65,86 dan dinyatakan lulus">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b2027"/><stop offset="0.5" stop-color="#0d1a22"/><stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="uteal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7d0"/><stop offset="1" stop-color="#14a4a0"/>
    </linearGradient>
    <radialGradient id="uglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#ubg)"/>

  <!-- pancaran gelombang dari antena -->
  <ellipse cx="1250" cy="430" rx="430" ry="400" fill="url(#uglow)"/>
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round">
    <path d="M1250 470 a 70 70 0 0 1 0 -140" stroke-width="7" stroke-opacity="0.85"/>
    <path d="M1250 530 a 130 130 0 0 1 0 -260" stroke-width="6" stroke-opacity="0.55"/>
    <path d="M1250 590 a 190 190 0 0 1 0 -380" stroke-width="5" stroke-opacity="0.34"/>
    <path d="M1250 650 a 250 250 0 0 1 0 -500" stroke-width="4" stroke-opacity="0.18"/>
  </g>
  <!-- tiang antena -->
  <g stroke="#5eead4" stroke-width="6" stroke-linecap="round">
    <line x1="1250" y1="400" x2="1250" y2="760"/>
    <line x1="1250" y1="418" x2="1180" y2="418"/><line x1="1250" y1="418" x2="1320" y2="418"/>
    <line x1="1250" y1="486" x2="1194" y2="486"/><line x1="1250" y1="486" x2="1306" y2="486"/>
    <line x1="1250" y1="554" x2="1208" y2="554"/><line x1="1250" y1="554" x2="1292" y2="554"/>
  </g>
  <circle cx="1250" cy="392" r="11" fill="#6ee7d0"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="316" font-size="23" font-weight="700" letter-spacing="6" fill="#4fd1c5">PONTIANAK · 3 SEPTEMBER 2026</text>
    <text x="96" y="426" font-size="92" font-weight="800" letter-spacing="-3" fill="#f1f5f4">MULAI DARI</text>
    <text x="96" y="526" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#uteal)">SIAGA</text>
    <rect x="100" y="564" width="120" height="5" rx="2.5" fill="#14a4a0"/>
    <text x="100" y="636" font-size="31" fill="#8ba3a4">Catatan dari Ujian Negara Amatir</text>
    <text x="100" y="680" font-size="31" fill="#8ba3a4">Radio tingkat pertama.</text>

    <g>
      <rect x="100" y="748" width="252" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#245055" stroke-width="2"/>
      <text x="126" y="800" font-size="40" font-weight="800" fill="#6ee7d0">65</text>
      <text x="126" y="832" font-size="17" fill="#7e9496">soal pilihan ganda</text>

      <rect x="374" y="748" width="252" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#245055" stroke-width="2"/>
      <text x="400" y="800" font-size="40" font-weight="800" fill="#6ee7d0">120</text>
      <text x="400" y="832" font-size="17" fill="#7e9496">menit waktu ujian</text>

      <rect x="648" y="748" width="252" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#245055" stroke-width="2"/>
      <text x="674" y="800" font-size="40" font-weight="800" fill="#fbbf6b">65,86</text>
      <text x="674" y="832" font-size="17" fill="#7e9496">nilai akhir — lulus</text>
