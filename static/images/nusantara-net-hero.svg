<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Check-in di ORARI Nusantara Net pukul 20.30 dari sebuah HT genggam di Pontianak, terhubung lewat repeater ke stasiun di empat pulau">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/><stop offset="0.5" stop-color="#0b1420"/><stop offset="1" stop-color="#080d14"/>
    </linearGradient>
    <linearGradient id="nteal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0e9488"/>
    </linearGradient>
    <radialGradient id="nglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#nbg)"/>

  <!-- bintang samar -->
  <g fill="#cbd5e1" fill-opacity="0.35">
    <circle cx="1120" cy="170" r="2.5"/><circle cx="1348" cy="132" r="2"/><circle cx="1502" cy="228" r="2.5"/>
    <circle cx="1042" cy="286" r="2"/><circle cx="1420" cy="318" r="2"/><circle cx="1560" cy="404" r="2.5"/>
  </g>

  <ellipse cx="1240" cy="440" rx="400" ry="360" fill="url(#nglow)"/>

  <!-- menara repeater -->
  <g stroke="#5eead4" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="1232" y1="352" x2="1232" y2="700"/>
    <line x1="1232" y1="372" x2="1176" y2="372"/><line x1="1232" y1="372" x2="1288" y2="372"/>
    <line x1="1232" y1="436" x2="1190" y2="436"/><line x1="1232" y1="436" x2="1274" y2="436"/>
    <line x1="1232" y1="500" x2="1200" y2="500"/><line x1="1232" y1="500" x2="1264" y2="500"/>
  </g>
  <circle cx="1232" cy="344" r="10" fill="#7dd3fc"/>

  <!-- HT genggam -->
  <g>
    <line x1="1058" y1="614" x2="1058" y2="546" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1058" cy="542" r="6" fill="#7dd3fc"/>
    <rect x="1032" y="614" width="52" height="98" rx="11" fill="#ffffff" fill-opacity="0.07" stroke="#3f7d84" stroke-width="3"/>
    <rect x="1043" y="628" width="30" height="20" rx="4" fill="#5eead4" fill-opacity="0.55"/>
  </g>
  <!-- pancaran HT ke menara -->
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round">
    <path d="M1092 552 a 44 44 0 0 1 0 60" stroke-width="5" stroke-opacity="0.8"/>
    <path d="M1116 534 a 76 76 0 0 1 0 96" stroke-width="4.5" stroke-opacity="0.5"/>
    <path d="M1140 516 a 108 108 0 0 1 0 132" stroke-width="4" stroke-opacity="0.28"/>
  </g>

  <!-- lompatan jaringan ke stasiun jauh -->
  <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="10 12" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M1244 350 Q 1400 350 1452 424"/>
    <path d="M1244 356 Q 1430 430 1496 536"/>
    <path d="M1244 364 Q 1408 500 1444 638"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="1456" cy="430" r="9"/><circle cx="1500" cy="542" r="9"/><circle cx="1448" cy="644" r="9"/>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="316" font-size="23" font-weight="700" letter-spacing="6" fill="#5eead4">ORARI NUSANTARA NET · 20.30 WIB</text>
    <text x="96" y="426" font-size="88" font-weight="800" letter-spacing="-3" fill="#f1f5f9">JAM SETENGAH</text>
    <text x="96" y="524" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#nteal)">SEMBILAN MALAM</text>
    <rect x="100" y="562" width="120" height="5" rx="2.5" fill="#0e9488"/>
    <text x="100" y="634" font-size="31" fill="#8496a8">Sebuah HT genggam, sebuah repeater,</text>
    <text x="100" y="678" font-size="31" fill="#8496a8">dan suara dari seberang laut.</text>

    <g>
      <rect x="100" y="748" width="252" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#22505c" stroke-width="2"/>
      <text x="126" y="800" font-size="40" font-weight="800" fill="#7dd3fc">20.30</text>
      <text x="126" y="832" font-size="17" fill="#7b8b9a">check-in tiap malam</text>

      <rect x="374" y="748" width="252" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#22505c" stroke-width="2"/>
      <text x="400" y="800" font-size="40" font-weight="800" fill="#7dd3fc">4</text>
      <text x="400" y="832" font-size="17" fill="#7b8b9a">pulau yang terdengar</text>

      <rect x="648" y="748" width="278" height="118" rx="16" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-width="2.5"/>
      <text x="674" y="800" font-size="40" font-weight="800" letter-spacing="1.5" fill="#6ee7d0">YD7AQT</text>
      <text x="674" y="832" font-size="17" fill="#7b8b9a">tanda panggil</text>
    </g>
  </g>
</svg>
