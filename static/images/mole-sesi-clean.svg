<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-label="Empat sesi pembersihan Mole: 22 GB pada 21 Maret, 2,8 GB pada 26 Maret, 13,8 GB pada 1 Juni, dan 12,4 GB pada 24 September. Sampah yang dihapus pada Juni tumbuh kembali hampir sebanyak semula dalam 3,8 bulan.">
  <defs>
    <linearGradient id="bgreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe0b4"/><stop offset="1" stop-color="#2fa37a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="860" fill="#0e1219"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="98" font-size="22" font-weight="700" letter-spacing="5" fill="#4cc79a">EMPAT KALI MENJALANKAN mo clean</text>
    <text x="100" y="156" font-size="38" font-weight="800" fill="#f2f4f8">Sampahnya tumbuh lagi, tiap kali</text>
  </g>

  <line x1="180" y1="648" x2="1500" y2="648" stroke="#2a3340" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="230" y="230.0" width="176" height="418.0" rx="10" fill="#1c3b34" stroke="#2a5a4e" stroke-width="2.5"/>
    <text x="318.0" y="208.0" font-size="34" font-weight="800" fill="#f2f4f8" text-anchor="middle">22,0 GB</text>
    <text x="318.0" y="690" font-size="26" font-weight="700" fill="#c9d1dc" text-anchor="middle">21 Mar</text>
    <text x="318.0" y="724" font-size="21" fill="#7e8b86" text-anchor="middle">3.075 berkas</text>
    <rect x="530" y="594.8" width="176" height="53.2" rx="10" fill="#1c3b34" stroke="#2a5a4e" stroke-width="2.5"/>
    <text x="618.0" y="572.8" font-size="34" font-weight="800" fill="#f2f4f8" text-anchor="middle">2,8 GB</text>
    <text x="618.0" y="690" font-size="26" font-weight="700" fill="#c9d1dc" text-anchor="middle">26 Mar</text>
    <text x="618.0" y="724" font-size="21" fill="#7e8b86" text-anchor="middle">27 berkas</text>
    <rect x="830" y="385.8" width="176" height="262.2" rx="10" fill="url(#bgreen)" stroke="#2fa37a" stroke-width="2.5"/>
    <text x="918.0" y="363.8" font-size="34" font-weight="800" fill="#f2f4f8" text-anchor="middle">13,8 GB</text>
    <text x="918.0" y="690" font-size="26" font-weight="700" fill="#c9d1dc" text-anchor="middle">1 Jun</text>
    <text x="918.0" y="724" font-size="21" fill="#7e8b86" text-anchor="middle">4.373 berkas</text>
    <rect x="1130" y="412.4" width="176" height="235.6" rx="10" fill="url(#bgreen)" stroke="#2fa37a" stroke-width="2.5"/>
    <text x="1218.0" y="390.4" font-size="34" font-weight="800" fill="#f2f4f8" text-anchor="middle">12,4 GB</text>
    <text x="1218.0" y="690" font-size="26" font-weight="700" fill="#c9d1dc" text-anchor="middle">24 Sep</text>
    <text x="1218.0" y="724" font-size="21" fill="#7e8b86" text-anchor="middle">2.344 berkas</text>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <path d="M 918.0 300 L 918.0 268 L 1218.0 268 L 1218.0 400" fill="none" stroke="#e0b64c" stroke-width="2.5" stroke-dasharray="7 6"/>
    <rect x="853.0" y="196" width="430" height="62" rx="12" fill="#e0b64c" fill-opacity="0.12" stroke="#e0b64c" stroke-width="2"/>
    <text x="1068.0" y="236" font-size="25" font-weight="700" fill="#f0cd78" text-anchor="middle">3,8 bulan &#8594; 12,4 GB tumbuh lagi</text>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="800" font-size="23" fill="#8a94a5">Sekitar 3,3 GB per bulan. Membersihkan bukan memperbaiki — cuma memanen.</text>
  </g>
</svg>
