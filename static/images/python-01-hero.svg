<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Python Dasar bagian 01: memilih antara Python dan Excel sesuai pekerjaannya">
  <defs>
