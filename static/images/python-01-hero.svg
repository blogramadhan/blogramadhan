    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#p1bg)"/>
  <ellipse cx="1250" cy="410" rx="370" ry="300" fill="url(#p1glow)"/>

  <!-- percabangan: satu pekerjaan, dua jalan -->
  <g>
