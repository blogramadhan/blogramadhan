<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Konversi Data — alat mengubah berkas JSON dan CSV menjadi Excel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.6" stop-color="#111d1b"/><stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="xl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.20"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L11 6 L0 11 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03">    <path d="M100 0V1000M200 0V1000M300 0V1000M400 0V1000M500 0V1000M600 0V1000M700 0V1000M800 0V1000M900 0V1000M1000 0V1000M1100 0V1000M1200 0V1000M1300 0V1000M1400 0V1000M1500 0V1000"/>    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600"/>  </g>  <ellipse cx="1150" cy="500" rx="600" ry="480" fill="url(#glow)"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="352" font-size="23" font-weight="700" letter-spacing="6" fill="#34d399">ALAT BANTU DATA</text>
    <text x="96" y="452" font-size="74" font-weight="800" letter-spacing="-2" fill="#f2f4f8">KONVERSI</text>
    <text x="96" y="538" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#grn)">DATA</text>
    <rect x="100" y="574" width="110" height="5" rx="2.5" fill="#10b981"/>
    <text x="100" y="642" font-size="31" fill="#9aa5b6">JSON &amp; CSV ke Excel</text>
    <text x="100" y="690" font-size="22" fill="#6f7b8d">Unggah berkas atau tempel URL — hasilnya .xlsx.</text>
    <g>
      <rect x="100" y="736" width="352" height="54" rx="27" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45" stroke-width="2"/>
      <text x="276" y="771" text-anchor="middle" font-size="23" font-weight="600" fill="#6ee7b7">konversi-data.pbj.my.id</text>
    </g>

    <!-- Alur konversi -->
    <g>
      <rect x="800" y="300" width="190" height="95" rx="16" fill="#12171f" stroke="#232a36" stroke-width="2"/>
      <text x="895" y="360" text-anchor="middle" font-size="34" font-weight="700" fill="#e8eaed">JSON</text>
      <rect x="800" y="425" width="190" height="95" rx="16" fill="#12171f" stroke="#232a36" stroke-width="2"/>
      <text x="895" y="485" text-anchor="middle" font-size="34" font-weight="700" fill="#e8eaed">CSV</text>
      <path d="M1020 410 H1120" stroke="#10b981" stroke-width="5" marker-end="url(#ar)" stroke-linecap="round"/>
      <rect x="1160" y="300" width="300" height="220" rx="20" fill="url(#xl)"/>      <rect x="1230" y="332" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>      <rect x="1266" y="332" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>      <rect x="1302" y="332" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>      <rect x="1338" y="332" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>      <rect x="1230" y="362" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1266" y="362" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1302" y="362" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1338" y="362" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1230" y="392" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1266" y="392" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1302" y="392" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <rect x="1338" y="392" width="32" height="26" rx="4" fill="#ffffff" fill-opacity="0.45"/>      <text x="1310" y="482" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="1" fill="#ffffff">XLSX</text>
    </g>

    <!-- Mock antarmuka -->
    <g>
      <rect x="800" y="600" width="660" height="250" rx="18" fill="#12171f" stroke="#232a36" stroke-width="2"/>
      <rect x="824" y="624" width="200" height="52" rx="12" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.5" stroke-width="2"/>
      <text x="924" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#6ee7b7">Upload File</text>
      <rect x="1040" y="624" width="170" height="52" rx="12" fill="#171d27" stroke="#2a3340" stroke-width="2"/>
      <text x="1125" y="657" text-anchor="middle" font-size="20" fill="#8a94a5">Dari URL</text>

      <rect x="824" y="700" width="400" height="110" rx="14" fill="#0f141c" stroke="#2f3a48" stroke-width="2" stroke-dasharray="10 8"/>
      <text x="1024" y="748" text-anchor="middle" font-size="20" fill="#8a94a5">Seret berkas .json / .csv</text>
      <text x="1024" y="778" text-anchor="middle" font-size="17" fill="#5f6a7a">atau klik untuk memilih</text>

      <rect x="1250" y="728" width="186" height="56" rx="12" fill="#10b981"/>
      <text x="1343" y="765" text-anchor="middle" font-size="21" font-weight="700" fill="#04231a">Konversi</text>
    </g>
  </g>
</svg>
