<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Grafik batang konsentrasi PM2.5: pedoman WHO 15, baku mutu Indonesia 55, awal kategori Hazardous 225,5, ujung skala US AQI 325,4, dan Pontianak 963 mikrogram per meter kubik">
  <rect width="1600" height="1000" fill="#12171f"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="70" y="104" font-size="50" font-weight="800" fill="#f2f4f8">Di Mana Skalanya Habis</text>
    <text x="70" y="152" font-size="25" fill="#8a94a5">Konsentrasi PM2.5 di Pontianak dibanding pedoman kesehatan dan ujung skala US AQI.</text>
    <rect x="70" y="180" width="96" height="4" rx="2" fill="#d9452f"/>

    <!-- garis bantu -->
    <line x1="734.5" y1="280" x2="734.5" y2="812" stroke="#232a36" stroke-width="2" stroke-dasharray="3 7"/>
    <text x="734.5" y="848" text-anchor="middle" font-size="19" fill="#6f7b8d">200</text>
    <line x1="908.9" y1="280" x2="908.9" y2="812" stroke="#232a36" stroke-width="2" stroke-dasharray="3 7"/>
    <text x="908.9" y="848" text-anchor="middle" font-size="19" fill="#6f7b8d">400</text>
    <line x1="1083.4" y1="280" x2="1083.4" y2="812" stroke="#232a36" stroke-width="2" stroke-dasharray="3 7"/>
    <text x="1083.4" y="848" text-anchor="middle" font-size="19" fill="#6f7b8d">600</text>
    <line x1="1257.8" y1="280" x2="1257.8" y2="812" stroke="#232a36" stroke-width="2" stroke-dasharray="3 7"/>
    <text x="1257.8" y="848" text-anchor="middle" font-size="19" fill="#6f7b8d">800</text>
    <line x1="560" y1="280" x2="560" y2="812" stroke="#2a3340" stroke-width="2"/>
    <text x="560" y="848" text-anchor="middle" font-size="19" fill="#6f7b8d">0</text>
    <text x="560" y="884" font-size="18" fill="#5f6a7a">mikrogram per meter kubik</text>

    <!-- 1. WHO 15 -->
    <text x="530" y="326" text-anchor="end" font-size="25" fill="#e8eaed">Pedoman WHO 24 jam</text>
    <rect x="560" y="300" width="13.1" height="60" rx="4" fill="#199e70"/>
    <text x="592" y="349" font-size="26" font-weight="700" fill="#eef1f6">15</text>

    <!-- 2. Baku mutu RI 55 -->
    <text x="530" y="432" text-anchor="end" font-size="25" fill="#e8eaed">Baku mutu RI 24 jam</text>
    <rect x="560" y="406" width="48" height="60" rx="4" fill="#199e70"/>
    <text x="626" y="455" font-size="26" font-weight="700" fill="#eef1f6">55</text>

    <!-- 3. Awal Hazardous 225,5 -->
    <text x="530" y="538" text-anchor="end" font-size="25" fill="#e8eaed">Awal kategori Hazardous</text>
    <rect x="560" y="512" width="196.7" height="60" rx="4" fill="#c98500"/>
    <text x="775" y="561" font-size="26" font-weight="700" fill="#eef1f6">225,5</text>

    <!-- 4. Ujung skala 325,4 -->
    <text x="530" y="644" text-anchor="end" font-size="25" fill="#e8eaed">Ujung skala US AQI (500)</text>
    <rect x="560" y="618" width="283.8" height="60" rx="4" fill="#c98500"/>
    <text x="862" y="667" font-size="26" font-weight="700" fill="#eef1f6">325,4</text>

    <!-- 5. Pontianak 963 -->
    <text x="530" y="750" text-anchor="end" font-size="25" fill="#e8eaed">Pontianak, 12 Sep 10.00</text>
    <rect x="560" y="724" width="840" height="60" rx="4" fill="#d9452f"/>
    <text x="1418" y="773" font-size="26" font-weight="700" fill="#f3b0a2">963,0</text>

    <!-- penanda ujung skala menembus batang Pontianak -->
    <line x1="843.8" y1="700" x2="843.8" y2="806" stroke="#12171f" stroke-width="9"/>
    <line x1="843.8" y1="700" x2="843.8" y2="806" stroke="#e8a05a" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="860" y="761" font-size="19" font-weight="600" fill="#ffd9cf">batas atas skala US AQI</text>

    <text x="70" y="928" font-size="18" fill="#66707f">Breakpoint US AQI mengikuti revisi EPA Mei 2024; segmen teratas 225,5–325,4 µg/m³ setara AQI 301–500.</text>
    <text x="70" y="958" font-size="18" fill="#66707f">Angka Pontianak adalah pembacaan sesaat, sedangkan pedoman WHO dan baku mutu RI adalah ambang rata-rata 24 jam.</text>
  </g>
</svg>
