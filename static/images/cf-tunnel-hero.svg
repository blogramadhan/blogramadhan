<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Cloudflare Tunnel: server lokal tanpa IP publik bisa diakses lewat domain sendiri, karena cloudflared menelepon keluar dan port masuk tetap tertutup">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a1d0c"/><stop offset="0.5" stop-color="#14120f"/><stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="corange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbad41"/><stop offset="1" stop-color="#f6821f"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6821f" stop-opacity="0.16"/><stop offset="1" stop-color="#f6821f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#cbg)"/>
  <ellipse cx="1250" cy="420" rx="340" ry="300" fill="url(#cglow)"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <!-- pengunjung -->
    <rect x="990" y="256" width="200" height="86" rx="12" fill="#16202c" stroke="#5f82a8" stroke-width="2.5"/>
    <text x="1090" y="296" font-size="21" font-weight="700" fill="#9ec0e0" text-anchor="middle">Pengunjung</text>
    <text x="1090" y="322" font-size="17" fill="#6f8599" text-anchor="middle">dari mana saja</text>

    <!-- cloudflare + gembok -->
    <rect x="1240" y="256" width="250" height="86" rx="12" fill="#33240f" stroke="#f6821f" stroke-width="2.5"/>
    <text x="1365" y="294" font-size="21" font-weight="700" fill="#fbad41" text-anchor="middle">Cloudflare</text>
    <text x="1365" y="320" font-size="17" fill="#9a8360" text-anchor="middle">Access memeriksa dulu</text>
    <path d="M 1196 299 L 1230 299" stroke="#5f82a8" stroke-width="3"/>
    <polygon points="1226,291 1226,307 1242,299" fill="#5f82a8"/>

    <!-- terowongan -->
    <path d="M 1365 350 L 1365 470" stroke="#f6821f" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="1388" y="420" font-size="19" fill="#9a8360">terowongan</text>

    <!-- server + firewall -->
    <rect x="990" y="492" width="500" height="150" rx="14" fill="#141a20" stroke="#4a545c" stroke-width="2.5"/>
    <text x="1014" y="532" font-size="18" font-weight="700" letter-spacing="3" fill="#7e8b92">JARINGAN ANDA</text>

    <rect x="1014" y="550" width="196" height="70" rx="10" fill="#1b2630" stroke="#5f82a8" stroke-width="2"/>
    <text x="1112" y="580" font-size="19" font-weight="700" fill="#9ec0e0" text-anchor="middle">cloudflared</text>
    <text x="1112" y="604" font-size="16" fill="#6f8599" text-anchor="middle">menelepon keluar</text>

    <rect x="1240" y="550" width="226" height="70" rx="10" fill="#1b2630" stroke="#4a545c" stroke-width="2"/>
    <text x="1353" y="580" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#c9d1dc" text-anchor="middle">localhost:3000</text>
    <text x="1353" y="604" font-size="16" fill="#6f8599" text-anchor="middle">aplikasi Anda</text>

    <!-- panah keluar dari cloudflared -->
    <path d="M 1112 544 L 1112 470 L 1352 470" fill="none" stroke="#f6821f" stroke-width="3"/>
    <polygon points="1348,462 1348,478 1364,470" fill="#f6821f"/>

    <!-- gembok port masuk -->
    <g transform="translate(1000,676)">
      <rect x="0" y="12" width="34" height="28" rx="5" fill="#2e1a1a" stroke="#a45555" stroke-width="2.5"/>
      <path d="M 8 12 L 8 6 A 9 9 0 0 1 26 6 L 26 12" fill="none" stroke="#a45555" stroke-width="2.5"/>
      <text x="50" y="34" font-size="20" fill="#c99a9a">Tidak ada port masuk yang dibuka</text>
    </g>
  </g>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="100" y="308" font-size="23" font-weight="700" letter-spacing="6" fill="#fbad41">CLOUDFLARE TUNNEL · ZERO TRUST</text>
    <text x="96" y="424" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#f4f2ec">SERVER LOKAL</text>
    <text x="96" y="512" font-size="76" font-weight="800" letter-spacing="-2.5" fill="url(#corange)">BERASA PUBLIK</text>
    <rect x="100" y="550" width="120" height="5" rx="2.5" fill="#f6821f"/>
    <text x="100" y="622" font-size="31" fill="#998f84">Tanpa IP publik, tanpa buka port,</text>
    <text x="100" y="666" font-size="31" fill="#998f84">tanpa VPN. Lalu dikunci lagi.</text>

    <g>
      <rect x="100" y="746" width="230" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#4a3f30" stroke-width="2"/>
      <text x="126" y="798" font-size="38" font-weight="800" fill="#f4f2ec">0</text>
      <text x="126" y="830" font-size="17" fill="#8a8178">port masuk dibuka</text>

      <rect x="352" y="746" width="230" height="118" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#4a3f30" stroke-width="2"/>
      <text x="378" y="798" font-size="38" font-weight="800" fill="#fbad41">gratis</text>
      <text x="378" y="830" font-size="17" fill="#8a8178">untuk pemakaian biasa</text>

      <rect x="604" y="746" width="250" height="118" rx="16" fill="#f6821f" fill-opacity="0.12" stroke="#f6821f" stroke-width="2.5"/>
      <text x="630" y="798" font-size="34" font-weight="800" fill="#fbad41">tolak</text>
      <text x="630" y="830" font-size="17" fill="#8a8178">bawaan Access, sebelum diizinkan</text>
    </g>
  </g>
</svg>
