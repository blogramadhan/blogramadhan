    <text x="666" y="628" font-size="24" fill="#c9d1dc">List dan Tuple</text>
    <text x="610" y="666" font-size="24" font-weight="700" fill="#4f9bec">08</text>
    <text x="666" y="666" font-size="24" fill="#c9d1dc">Dictionary dan Set</text>
    <text x="610" y="704" font-size="24" font-weight="700" fill="#4f9bec">09</text>
    <text x="666" y="704" font-size="24" fill="#c9d1dc">Comprehension</text>
    <line x1="580" y1="594" x2="580" y2="712" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="748" width="1440" height="158" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="748" width="8" height="158" rx="4" fill="#6ab8f4"/>
