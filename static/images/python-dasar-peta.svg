    <text x="120" y="836" font-size="29" font-weight="800" fill="#e8edf4">Merapikan Kode</text>
    <text x="610" y="802" font-size="24" font-weight="700" fill="#6ab8f4">10</text>
    <text x="666" y="802" font-size="24" fill="#c9d1dc">Fungsi</text>
    <text x="610" y="840" font-size="24" font-weight="700" fill="#6ab8f4">11</text>
    <text x="666" y="840" font-size="24" fill="#c9d1dc">Modul, Paket, dan pip</text>
    <text x="610" y="878" font-size="24" font-weight="700" fill="#6ab8f4">12</text>
    <text x="666" y="878" font-size="24" fill="#c9d1dc">Menangani Error</text>
    <line x1="580" y1="768" x2="580" y2="886" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="922" width="1440" height="158" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="922" width="8" height="158" rx="4" fill="#8ad6fb"/>
    <text x="120" y="972" font-size="21" font-weight="700" letter-spacing="3" fill="#8ad6fb">TAHAP V</text>
    <text x="120" y="1010" font-size="29" font-weight="800" fill="#e8edf4">Keluar dari Layar</text>
    <text x="610" y="976" font-size="24" font-weight="700" fill="#8ad6fb">13</text>
    <text x="666" y="976" font-size="24" fill="#c9d1dc">Membaca dan Menulis Berkas</text>
    <text x="610" y="1014" font-size="24" font-weight="700" fill="#8ad6fb">14</text>
    <text x="666" y="1014" font-size="24" fill="#c9d1dc">CSV dan Excel</text>
    <text x="610" y="1052" font-size="24" font-weight="700" fill="#8ad6fb">15</text>
    <text x="666" y="1052" font-size="24" fill="#c9d1dc">Proyek Penutup: Rekap Otomatis</text>
    <line x1="580" y1="942" x2="580" y2="1060" stroke="#1d2836" stroke-width="2"/>
    <text x="80" y="1154" font-size="22" fill="#6f7b8c">Tanpa prasyarat. Tiap bagian berdiri di atas bagian sebelumnya — lompat bagian berarti menambal lubang belakangan.</text>
  </g>
</svg>