<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1192" width="1600" height="1192" role="img" aria-label="Peta seri Belajar Python Dasar: lima tahap berisi lima belas bagian, dari menyiapkan alat sampai proyek rekap otomatis">
  <rect width="1600" height="1192" fill="#0e1219"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="80" y="104" font-size="50" font-weight="800" fill="#f2f4f8">Peta Seri: Lima Tahap, Lima Belas Bagian</text>
    <text x="80" y="156" font-size="26" fill="#8a94a5">Dikerjakan berurutan. Tiap tahap memakai semua yang dipelajari di tahap sebelumnya.</text>
    <rect x="80" y="226" width="1440" height="120" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="226" width="8" height="120" rx="4" fill="#2a6fbd"/>
    <text x="120" y="276" font-size="21" font-weight="700" letter-spacing="3" fill="#2a6fbd">TAHAP I</text>
    <text x="120" y="314" font-size="29" font-weight="800" fill="#e8edf4">Mulai</text>
    <text x="610" y="280" font-size="24" font-weight="700" fill="#2a6fbd">01</text>
    <text x="666" y="280" font-size="24" fill="#c9d1dc">Kenapa Python, dan Kapan Bukan</text>
    <text x="610" y="318" font-size="24" font-weight="700" fill="#2a6fbd">02</text>
    <text x="666" y="318" font-size="24" fill="#c9d1dc">Menyiapkan Alat: Colab atau Komputer Sendiri</text>
    <line x1="580" y1="246" x2="580" y2="326" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="362" width="1440" height="196" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="362" width="8" height="196" rx="4" fill="#3987e5"/>
    <text x="120" y="412" font-size="21" font-weight="700" letter-spacing="3" fill="#3987e5">TAHAP II</text>
    <text x="120" y="450" font-size="29" font-weight="800" fill="#e8edf4">Dasar Bahasa</text>
    <text x="610" y="416" font-size="24" font-weight="700" fill="#3987e5">03</text>
    <text x="666" y="416" font-size="24" fill="#c9d1dc">Variabel dan Tipe Data</text>
    <text x="610" y="454" font-size="24" font-weight="700" fill="#3987e5">04</text>
    <text x="666" y="454" font-size="24" fill="#c9d1dc">String: Merapikan Teks</text>
    <text x="610" y="492" font-size="24" font-weight="700" fill="#3987e5">05</text>
    <text x="666" y="492" font-size="24" fill="#c9d1dc">Percabangan: if, elif, else</text>
    <text x="610" y="530" font-size="24" font-weight="700" fill="#3987e5">06</text>
    <text x="666" y="530" font-size="24" fill="#c9d1dc">Perulangan: for dan while</text>
    <line x1="580" y1="382" x2="580" y2="538" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="574" width="1440" height="158" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#1d2836" stroke-width="2"/>
    <rect x="80" y="574" width="8" height="158" rx="4" fill="#4f9bec"/>
    <text x="120" y="624" font-size="21" font-weight="700" letter-spacing="3" fill="#4f9bec">TAHAP III</text>
    <text x="120" y="662" font-size="29" font-weight="800" fill="#e8edf4">Menyimpan Banyak Data</text>
